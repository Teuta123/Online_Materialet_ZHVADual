<!doctype html><html lang="sq"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><title>CSS hap pas hapi</title></head><body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  --bg:#F2F5F4; --surface:#FFFFFF; --surface2:#E9EEEC; --ink:#172033; --muted:#566074; --line:#D5DDDA;
  --accent:#0E6E73; --accent-ink:#FFFFFF; --accent-soft:#DDF1F1; --mark:#B86E0B; --mark-soft:#FCEFD9;
  --good:#1C7C3A; --good-soft:#E1F3E6; --bad:#B42318; --bad-soft:#FBE6E3;
  --code-bg:#172033; --code-ink:#E7EEF2;
  --svg-ink:#172033; --svg-line:#4B5670; --svg-fill:#FFFFFF; --svg-stroke:#8A93A8; --svg-accent:#0E6E73; --svg-accentFill:#DDF1F1; --svg-muted:#5B6478; --svg-onAccent:#FFFFFF; --svg-good:#1C7C3A; --svg-bad:#B42318;
  --display:'Bricolage Grotesque', 'Onest', system-ui, sans-serif;
  --body:'Onest', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono:'JetBrains Mono', ui-monospace, Consolas, monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E1417; --surface:#162026; --surface2:#1D2A31; --ink:#E4ECEE; --muted:#9BA9B1; --line:#2A3942;
    --accent:#4CC2BD; --accent-ink:#06282A; --accent-soft:#12383A; --mark:#F0B35B; --mark-soft:#3A2B14;
    --good:#5CCB7E; --good-soft:#153524; --bad:#FF8A7A; --bad-soft:#3D1C18;
    --code-bg:#0A0F12; --code-ink:#DDE7EA;
    --svg-ink:#E4ECEE; --svg-line:#A9B6BE; --svg-fill:#162026; --svg-stroke:#5D6F79; --svg-accent:#4CC2BD; --svg-accentFill:#12383A; --svg-muted:#9BA9B1; --svg-onAccent:#06282A; --svg-good:#5CCB7E; --svg-bad:#FF8A7A;
  }
}
:root[data-theme="dark"]{
    color-scheme:dark;
    --bg:#0E1417; --surface:#162026; --surface2:#1D2A31; --ink:#E4ECEE; --muted:#9BA9B1; --line:#2A3942;
    --accent:#4CC2BD; --accent-ink:#06282A; --accent-soft:#12383A; --mark:#F0B35B; --mark-soft:#3A2B14;
    --good:#5CCB7E; --good-soft:#153524; --bad:#FF8A7A; --bad-soft:#3D1C18;
    --code-bg:#0A0F12; --code-ink:#DDE7EA;
    --svg-ink:#E4ECEE; --svg-line:#A9B6BE; --svg-fill:#162026; --svg-stroke:#5D6F79; --svg-accent:#4CC2BD; --svg-accentFill:#12383A; --svg-muted:#9BA9B1; --svg-onAccent:#06282A; --svg-good:#5CCB7E; --svg-bad:#FF8A7A;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;padding-inline:16px;padding-block:0 48px}
.wrap{max-width:1120px;margin:0 auto}
h1,h2,h3{font-family:var(--display);text-wrap:balance;line-height:1.15;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:16px;padding-block:28px 20px;border-bottom:1px solid var(--line)}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.top h1{font-size:clamp(28px,4.2vw,44px);font-weight:800;letter-spacing:-.01em;margin-top:6px}
.top p{margin:6px 0 0;color:var(--muted);max-width:60ch}
.overall{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px}
.overall b{font-family:var(--display);font-size:24px;font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:6px;background:var(--surface2);overflow:hidden;width:120px}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .4s}

/* layout */
.layout{display:grid;grid-template-columns:270px 1fr;gap:28px;margin-top:24px;align-items:start}
nav.ch{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);display:flex;flex-direction:column;gap:6px}
.chbtn{display:grid;grid-template-columns:64px 1fr;gap:10px;align-items:center;text-align:left;background:transparent;border:1px solid transparent;border-radius:10px;padding:8px 10px}
.chbtn:hover{background:var(--surface)}
.chbtn[aria-current="true"]{background:var(--surface);border-color:var(--line)}
.code{font-family:var(--mono);font-weight:600;font-size:13px;display:inline-grid;place-items:center;height:30px;border-radius:8px;background:var(--surface2);color:var(--ink)}
.chbtn[aria-current="true"] .code{background:var(--accent);color:var(--accent-ink)}
.chbtn span.t{font-size:14px;line-height:1.3;font-weight:500}
.chbtn small{display:block;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}

main{min-width:0}
.chead{display:flex;flex-direction:column;gap:8px;margin-bottom:18px}
.chead h2{font-size:clamp(24px,3.2vw,34px);font-weight:800}
.rm{margin:0;color:var(--muted)}
.rm b{color:var(--ink)}
.modes{display:flex;gap:4px;background:var(--surface2);padding:4px;border-radius:12px;width:max-content;max-width:100%;overflow-x:auto;margin:6px 0 22px}
.modes button{border:0;background:transparent;padding:8px 16px;border-radius:9px;font-weight:600;font-size:15px;white-space:nowrap}
.modes button[aria-selected="true"]{background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.08)}

/* learn */
.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px clamp(16px,3vw,28px);margin-bottom:16px}
.sec h3{font-size:21px;font-weight:700;margin-bottom:10px;display:flex;gap:10px;align-items:baseline}
.sec h3 .n{font-family:var(--mono);font-size:13px;color:var(--accent);font-weight:600}
.sec p{margin:0 0 12px;max-width:72ch}
.sec ul{margin:0 0 12px;padding-left:20px;max-width:72ch}
.sec li{margin:4px 0}
.tbl{overflow-x:auto;margin:6px 0 14px;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--surface2);font-weight:600;font-size:13px;letter-spacing:.02em}
tr:last-child td{border-bottom:0}
td code, .mono{font-family:var(--mono);font-size:13px}
pre{background:var(--code-bg);color:var(--code-ink);font-family:var(--mono);font-size:13.5px;line-height:1.55;padding:14px 16px;border-radius:10px;overflow-x:auto;margin:6px 0 14px}
.note{border-left:3px solid var(--mark);background:var(--mark-soft);padding:10px 14px;border-radius:0 10px 10px 0;margin:6px 0 12px;max-width:72ch}
.formula{font-family:var(--display);font-weight:700;font-size:18px;background:var(--accent-soft);color:var(--ink);padding:12px 16px;border-radius:10px;margin:6px 0 14px;display:inline-block}
figure{margin:8px 0 16px;overflow-x:auto}
figure svg{max-width:100%;height:auto;display:block;margin:0 auto}

.rm.intro{color:var(--ink);max-width:75ch;margin-top:4px}
.sec h4.sub{font-family:var(--display);font-size:17px;margin:16px 0 8px}
.box{border-left:3px solid var(--accent);background:var(--accent-soft);padding:10px 14px;border-radius:0 10px 10px 0;margin:8px 0 14px;max-width:76ch}
.box span{display:block;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:4px}
.box.def{font-weight:600}
.box.did{border-color:var(--mark);background:var(--mark-soft)} .box.did span{color:var(--mark)}
.box.warn{border-color:var(--bad);background:var(--bad-soft)} .box.warn span{color:var(--bad)}
.box.ex{border-color:var(--muted);background:var(--surface2)} .box.ex span{color:var(--muted)} .box.ex p{margin:4px 0}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;background:var(--surface2);border-radius:10px;padding:12px;margin:8px 0 14px}
.flow b{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:14px}
.flow i{color:var(--muted);font-style:normal}
.codewrap,.try,.apisim{margin:8px 0 16px}
.ctitle{font-family:var(--mono);font-size:12px;color:var(--muted);margin-bottom:6px;display:flex;gap:8px;align-items:center}
.ctitle span{background:var(--accent);color:var(--accent-ink);border-radius:5px;padding:1px 6px;font-weight:600}
.codewrap pre{margin:0}
.try textarea{width:100%;font-family:var(--mono);font-size:13.5px;line-height:1.55;background:var(--code-bg);color:var(--code-ink);border:0;border-radius:10px 10px 0 0;padding:14px 16px;resize:vertical;tab-size:2;display:block}
.trybar{display:flex;gap:8px;padding:8px;background:var(--surface2)}
.try .out{margin:0;border-radius:0 0 10px 10px;background:var(--surface2);color:var(--ink);border-top:1px solid var(--line);min-height:44px;white-space:pre-wrap}
.out .e{color:var(--bad)} .out .w{color:var(--mark)} .out .m{color:var(--muted)}
.check{list-style:none;padding-left:0} .check li{padding-left:24px;position:relative;margin:6px 0} .check li::before{content:'✓';position:absolute;left:2px;color:var(--accent);font-weight:700}
.objectives{background:var(--accent-soft);border-color:transparent}
.lab{border-left:4px solid var(--accent)}
ol.rev li{margin:6px 0}
figcaption{text-align:center;font-size:13px;color:var(--muted);margin-top:6px}
.apisim{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--bg)}
.samples{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13px}
.chip:hover{border-color:var(--accent)}
.reqline{display:flex;gap:8px;flex-wrap:wrap}
.reqline select,.reqline input,.authrow select,.apisim textarea{font:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.reqline input{flex:1 1 200px;font-family:var(--mono)}
.authrow{display:flex;flex-wrap:wrap;gap:16px;margin:10px 0;font-size:14px;align-items:center}
.blabel{font-size:13px;font-weight:600;color:var(--muted)}
.apisim textarea{width:100%;font-family:var(--mono);margin-top:4px}
.resp{margin-top:10px}
.st{font-family:var(--mono);font-size:14px;padding:8px 12px;border-radius:8px;background:var(--surface2)}
.st.ok{background:var(--good-soft);color:var(--good)} .st.no{background:var(--bad-soft);color:var(--bad)}
#sim-out{margin-top:8px;max-height:320px}

.live{margin:8px 0 16px}
.lvgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.live textarea{width:100%;min-height:160px;font-family:var(--mono);font-size:13px;line-height:1.55;background:var(--code-bg);color:var(--code-ink);border:0;padding:12px 14px;resize:vertical;tab-size:2;display:block}
.pv{background:#fff;display:flex;flex-direction:column;min-width:0}
.pvbar{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#5B6478;background:#EEF1F0;padding:4px 10px}
.pv iframe{border:0;width:100%;min-height:140px;background:#fff;flex:1}
.lvbar{border-radius:0 0 10px 10px;background:transparent;padding:6px 0}
.task{border-top:1px solid var(--line);padding:16px 0}
.task:first-of-type{border-top:0}
.task .trybar{background:transparent;padding:4px 0;align-items:center;flex-wrap:wrap}
.tscore{font-size:14px;margin-left:6px}
.checks{list-style:none;padding:0;margin:6px 0 0;display:grid;gap:4px}
.checks li{font-size:14px;padding:6px 10px;border-radius:8px}
.checks li.ok{background:var(--good-soft);color:var(--good)}
.checks li.no{background:var(--bad-soft);color:var(--bad)}
.task .live .lvbar{display:none}
@media (max-width:760px){.lvgrid{grid-template-columns:1fr}}

/* flashcards */
.fc-wrap{display:grid;gap:16px;justify-items:center}
.card{width:min(560px,100%);min-height:230px;perspective:1200px;background:none;border:0;padding:0}
.card .in{position:relative;width:100%;min-height:230px;transition:transform .45s;transform-style:preserve-3d}
.card.flip .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:16px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:24px;text-align:center}
.face.back{transform:rotateY(180deg);background:var(--accent-soft)}
.face .term{font-family:var(--display);font-size:clamp(24px,4vw,32px);font-weight:800}
.face .def{font-size:17px;max-width:44ch}
.face small{position:absolute;bottom:12px;left:0;right:0;color:var(--muted);font-size:12px}
.fc-ctrl{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);padding:9px 16px;border-radius:10px;font-weight:600;font-size:15px}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.good{border-color:var(--good);color:var(--good)}
.btn.bad{border-color:var(--bad);color:var(--bad)}
.count{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px;min-width:70px;text-align:center}
.gloss{margin-top:22px;width:100%}
.gloss summary{cursor:pointer;font-weight:600}
.gloss dl{display:grid;grid-template-columns:minmax(130px,220px) 1fr;gap:8px 18px;margin:12px 0 0}
.gloss dt{font-weight:700}
.gloss dd{margin:0;color:var(--muted)}

/* practice */
.block{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px clamp(16px,3vw,26px);margin-bottom:16px}
.block h3{font-size:19px;font-weight:700;margin-bottom:4px}
.block .sub{color:var(--muted);font-size:14px;margin:0 0 14px}
.q{padding:14px 0;border-top:1px solid var(--line)}
.q:first-of-type{border-top:0}
.q .qt{font-weight:600;margin-bottom:8px}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (max-width:560px){.opts{grid-template-columns:1fr}}
.opt{text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 12px;font-size:15px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt.ok{background:var(--good-soft);border-color:var(--good)}
.opt.no{background:var(--bad-soft);border-color:var(--bad)}
.fb{font-size:14px;margin-top:8px;padding:8px 12px;border-radius:8px}
.fb.ok{background:var(--good-soft);color:var(--good)}
.fb.no{background:var(--bad-soft);color:var(--bad)}
.fb span{color:var(--ink)}
.tfrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.tfrow .opts{grid-template-columns:repeat(2,110px)}
.score{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.score b{font-variant-numeric:tabular-nums}
.order{list-style:none;padding:0;margin:0;display:grid;gap:6px}
.order li{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:6px 8px 6px 12px}
.order li.ok{border-color:var(--good);background:var(--good-soft)}
.order li.no{border-color:var(--bad);background:var(--bad-soft)}
.order .pos{font-family:var(--mono);font-size:13px;color:var(--muted);width:20px}
.order .txt{flex:1}
.order .mv{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:34px;height:32px;font-size:15px;line-height:1}
.ex{border-top:1px solid var(--line);padding:14px 0}
.ex:first-of-type{border-top:0}
.ex h4{margin:0 0 4px;font-size:16px}
.ex p{margin:0 0 8px;max-width:72ch}
.ex details{background:var(--accent-soft);border-radius:10px;padding:8px 12px}
.ex summary{cursor:pointer;font-weight:600;color:var(--accent)}
.ex details p{margin:8px 0 2px}

/* calculator */
.calc{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:8px 0 12px}
.calc label{display:grid;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
.calc input{font:inherit;font-size:16px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-variant-numeric:tabular-nums;width:100%}
.res{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.res div{background:var(--surface2);border-radius:10px;padding:10px 12px}
.res small{display:block;color:var(--muted);font-size:12px}
.res b{font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums}
.res .final{background:var(--accent);color:var(--accent-ink)}
.res .final small{color:inherit;opacity:.85}

@media (max-width:860px){
  .layout{grid-template-columns:1fr;gap:12px}
  nav.ch{position:static;flex-direction:row;overflow-x:auto;padding-bottom:6px;gap:6px}
  .chbtn{grid-template-columns:auto;padding:6px}
  .chbtn span.t{display:none}
  .chbtn .code{padding:0 12px}
  .gloss dl{grid-template-columns:1fr}
  .gloss dd{margin-bottom:6px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div style="max-width:1120px;margin:0 auto;padding-top:14px;font-size:14px"><a href="index.html" style="color:var(--accent,#0E6E73);font-weight:600;text-decoration:none">← Të gjitha materialet</a></div>
<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow">Kurs praktik · Klasa 10 · Zhvillues i Aplikacioneve Softuerike</div>
      <h1>CSS hap pas hapi</h1>
      <p>Nga rregulli i parë CSS te flexbox, grid, responsive dhe animacionet. Ndrysho stilet dhe shiko rezultatin menjëherë; zgjidh detyrat me kontroll automatik.</p>
    </div>
    <div class="overall" title="Përqindja e përgjigjeve të sakta në kuize">
      <div><div class="eyebrow">Progresi yt</div><div class="bar"><i id="ovbar"></i></div></div>
      <b id="ovpct">0%</b>
    </div>
  </header>
  <div class="layout">
    <nav class="ch" id="nav" aria-label="Kapitujt"></nav>
    <main id="main"></main>
  </div>

const fmt = v => { if (typeof v === 'string') return v; try { return JSON.stringify(v, null, 1).replace(/\n\s*/g, ' '); } catch(e) { return String(v); } };
function bindTry(){
  document.querySelectorAll('.try').forEach(box => {
    const ta = box.querySelector('textarea'), out = box.querySelector('.out'), orig = ta.value;
    const fit = () => { ta.style.height = 'auto'; ta.style.height = (ta.scrollHeight + 4) + 'px'; }; fit();
    ta.addEventListener('input', fit);
    ta.addEventListener('keydown', e => { if (e.key === 'Tab') { e.preventDefault(); const p = ta.selectionStart; ta.setRangeText('  ', p, ta.selectionEnd, 'end'); } if ((e.ctrlKey||e.metaKey) && e.key === 'Enter') box.querySelector('.run').click(); });
    box.querySelector('.reset').onclick = () => { ta.value = orig; fit(); out.textContent = 'Rezultati del këtu.'; out.className = 'out'; };
    box.querySelector('.run').onclick = () => {
      out.textContent = ''; out.className = 'out';
      const write = (cls, args) => { const line = document.createElement('div'); line.className = cls; line.textContent = args.map(fmt).join(' '); out.appendChild(line); };
      const con = { log: (...a) => write('', a), info: (...a) => write('', a), warn: (...a) => write('w', a), error: (...a) => write('e', a), table: a => write('', [a]) };
      try {
        const r = new Function('console', '"use strict";\n' + ta.value)(con);
        if (r && typeof r.then === 'function') r.catch(err => write('e', ['Gabim: ' + err.message]));
        setTimeout(() => { if (!out.childNodes.length) write('m', ['(Kodi u ekzekutua pa shfaqur asgjë. Përdor console.log(...)).']); }, 50);
      } catch (err) { write('e', [err.name + ': ' + err.message]); }
    };
  });
}

function runCheck(doc, code, c){

function simValidate(d){ const e = []; const y = new Date().getFullYear();
  if (!d.title || String(d.title).trim().length < 2) e.push('Titulli është i detyrueshëm (të paktën 2 shkronja).');
  if (!d.author || String(d.author).trim().length < 2) e.push('Autori është i detyrueshëm.');
  if (d.year != null && d.year !== '' && (!Number.isInteger(+d.year) || d.year < 1000 || d.year > y)) e.push(`Viti duhet të jetë numër nga 1000 deri në ${y}.`);
  if (d.copies !== undefined && (!Number.isInteger(+d.copies) || d.copies < 0)) e.push('Numri i kopjeve duhet të jetë numër i plotë 0 ose më i madh.');
  return e; }
function simHandle(method, url, body, auth, role){
  const u = new URL(url, 'http://localhost:3000'); const m = u.pathname.match(/^\/api\/books(?:\/(\d+))?\/?$/);
  if (u.pathname === '/api/health' && method === 'GET') return [200, { status: 'ok' }];
  if (!m) return [404, { error: 'Kjo rrugë nuk ekziston.' }];
  const id = m[1] ? +m[1] : null; const find = () => SIM.books.find(b => b.id === id);
  if (method === 'GET' && id === null) { const q = (u.searchParams.get('search')||'').toLowerCase(); return [200, SIM.books.filter(b => !q || b.title.toLowerCase().includes(q) || b.author.toLowerCase().includes(q))]; }
  if (method === 'GET') return find() ? [200, find()] : [404, { error: 'Libri nuk u gjet.' }];
  if (!auth) return [401, { error: 'Duhet të identifikohesh.' }];
  let data = {}; if (method === 'POST' || method === 'PUT') { try { data = body.trim() ? JSON.parse(body) : {}; } catch(e) { return [400, { error: 'Trupi nuk është JSON i vlefshëm: ' + e.message }]; } }
  if (method === 'POST' && id === null) { const e = simValidate(data); if (e.length) return [400, { errors: e }]; const b = { id: SIM.next++, isbn: data.isbn||null, title: data.title.trim(), author: data.author.trim(), year: data.year ?? null, copies: data.copies ?? 1 }; SIM.books.push(b); return [201, b]; }
  if (method === 'PUT' && id !== null) { const b = find(); if (!b) return [404, { error: 'Libri nuk u gjet.' }]; const e = simValidate(data); if (e.length) return [400, { errors: e }]; Object.assign(b, { title: data.title.trim(), author: data.author.trim(), year: data.year ?? null, copies: data.copies ?? 1, isbn: data.isbn || null }); return [200, b]; }
  if (method === 'DELETE' && id !== null) { if (role !== 'admin') return [403, { error: 'Nuk ke të drejtë për këtë veprim.' }]; const i = SIM.books.findIndex(b => b.id === id); if (i < 0) return [404, { error: 'Libri nuk u gjet.' }]; SIM.books.splice(i, 1); return [204, null]; }
  return [404, { error: 'Kjo rrugë nuk ekziston.' }];
}
const STATUS = {200:'OK',201:'Created',204:'No Content',400:'Bad Request',401:'Unauthorized',403:'Forbidden',404:'Not Found'};
function apisimHTML(){
  return `<div class="apisim"><div class="ctitle"><span>API</span>Simulatori i API-së së bibliotekës – provo kërkesa pa server</div>
  <div class="samples">${[['list','Lista'],['search','Kërkim'],['one','Një libër'],['create','Shto'],['bad','Të dhëna të gabuara'],['update','Ndrysho'],['del','Fshij'],['missing','ID që s\'ekziston']].map(([k,l])=>`<button class="chip" data-s="${k}">${l}</button>`).join('')}</div>
  <div class="reqline"><select id="sim-m" aria-label="Metoda"><option>GET</option><option>POST</option><option>PUT</option><option>DELETE</option></select><input id="sim-u" value="/api/books" aria-label="URL"><button class="btn pri" id="sim-send">Dërgo</button></div>
  <div class="authrow"><label><input type="checkbox" id="sim-auth"> Authorization: Bearer &lt;token&gt;</label><label>Roli <select id="sim-role"><option value="bibliotekar">bibliotekar</option><option value="admin">admin</option></select></label></div>
  <label class="blabel" for="sim-b">Body (JSON)</label><textarea id="sim-b" spellcheck="false" rows="6"></textarea>
  <div class="resp"><div id="sim-status" class="st">Zgjidh një shembull ose shkruaj kërkesën dhe kliko “Dërgo”.</div><pre id="sim-out"></pre></div></div>`;
}
function bindApisim(){
  const send = document.getElementById('sim-send'); if (!send) return;
  const $ = id => document.getElementById(id);
  document.querySelectorAll('.apisim .chip').forEach(b => b.onclick = () => { const [m,u,body] = SAMPLES[b.dataset.s]; $('sim-m').value = m; $('sim-u').value = u; $('sim-b').value = body; if (m !== 'GET') $('sim-auth').checked = true; if (b.dataset.s === 'del') $('sim-role').value = 'admin'; });
  send.onclick = () => {
    const m = $('sim-m').value, [code, data] = simHandle(m, $('sim-u').value.trim(), $('sim-b').value, $('sim-auth').checked, $('sim-role').value);
    const st = $('sim-status'); st.textContent = `${m} ${$('sim-u').value.trim()}  →  ${code} ${STATUS[code]||''}`; st.className = 'st ' + (code < 300 ? 'ok' : 'no');
    $('sim-out').textContent = data === null ? '(pa trup përgjigjeje)' : JSON.stringify(data, null, 2);
  };
}

/* ---------- REVIEW ---------- */
let fc = {i:0, known:new Set(), order:null};
function reviewHTML(c){
  return `<div class="fc-wrap">
    <button class="card" id="card" aria-label="Kthe kartelën"><div class="in"><div class="face"><div class="term" id="fterm"></div><small>Kliko për ta kthyer</small></div><div class="face back"><div class="def" id="fdef"></div><small>Kliko për ta kthyer</small></div></div></button>
    <div class="fc-ctrl">
      <button class="btn" id="fprev" aria-label="Kartela e mëparshme">←</button>
      <span class="count" id="fcount"></span>
      <button class="btn" id="fnext" aria-label="Kartela tjetër">→</button>
    </div>
    <div class="fc-ctrl">
      <button class="btn bad" id="fno">Ende jo</button>
      <button class="btn good" id="fyes">E dija</button>
      <button class="btn" id="fshuf">Përziej</button>
    </div>
    <p class="count" id="fknown" style="min-width:0"></p>
    <details class="gloss sec"><summary>Fjalori i kapitullit (${c.terms.length} terma)</summary><dl>${c.terms.map(t=>`<dt>${esc(t[0])}</dt><dd>${esc(t[1])}</dd>`).join('')}</dl></details>
  </div>`;
}
function bindReview(c){
  fc = {i:0, known:new Set(store.get('known:'+c.id, [])), order:c.terms.map((_,i)=>i)};
  const card = document.getElementById('card');
  const show = () => {
    const t = c.terms[fc.order[fc.i]];
    card.classList.remove('flip');
    document.getElementById('fterm').textContent = t[0];
    document.getElementById('fdef').textContent = t[1];
    document.getElementById('fcount').textContent = `${fc.i+1} / ${c.terms.length}`;
    document.getElementById('fknown').textContent = `I di: ${fc.known.size} nga ${c.terms.length} terma`;
  };
  card.onclick = () => card.classList.toggle('flip');
  const step = d => { fc.i = (fc.i + d + c.terms.length) % c.terms.length; show(); };
  document.getElementById('fprev').onclick = () => step(-1);
  document.getElementById('fnext').onclick = () => step(1);
  const mark = yes => { const k = fc.order[fc.i]; yes ? fc.known.add(k) : fc.known.delete(k); store.set('known:'+c.id, [...fc.known]); step(1); };
  document.getElementById('fyes').onclick = () => mark(true);
  document.getElementById('fno').onclick = () => mark(false);
  document.getElementById('fshuf').onclick = () => { fc.order.sort(()=>Math.random()-.5); fc.i=0; show(); };
  show();
}

/* ---------- PRACTICE ---------- */
function quizQ(q, idx, key){
  return `<div class="q" data-key="${key}" data-i="${idx}"><div class="qt">${idx+1}. ${esc(q.q)}</div><div class="opts">${q.o.map((o,j)=>`<button class="opt" data-j="${j}">${String.fromCharCode(97+j)}) ${esc(o)}</button>`).join('')}</div><div class="fbh"></div></div>`;
}
function practiceHTML(c){
  if (!c.quiz.length && !c.exercises.length) return `<div class="block"><h3>Pyetje për përsëritje</h3><ol>${c.review.map(q=>`<li>${esc(q)}</li>`).join('')}</ol><p class="sub">Për këtë kapitull, ushtrimi është vetë projekti. Shiko veprimtarinë praktike te “Mëso”.</p></div>`;
  let h = `<div class="block"><h3>Pyetje për përsëritje</h3><p class="sub">Përgjigju me gojë ose në fletore.</p><ol class="rev">${c.review.map(q=>`<li>${esc(q)}</li>`).join('')}</ol></div>`;
  h += `<div class="block"><h3>Kuiz</h3><p class="sub">Zgjidh përgjigjen. Shpjegimi del menjëherë.</p><div id="quiz">${c.quiz.map((q,i)=>quizQ(q,i,'quiz')).join('')}</div><div class="score"><span>Rezultati: <b id="qs">0 / ${c.quiz.length}</b></span><button class="btn" id="qreset">Fillo nga e para</button></div></div>`;
  h += `<div class="block"><h3>E vërtetë apo e gabuar?</h3><p class="sub">Vlerëso secilin pohim.</p><div id="tf">${c.tf.map((t,i)=>`<div class="q" data-i="${i}"><div class="tfrow"><div class="qt" style="margin:0;flex:1 1 260px">${esc(t[0])}</div><div class="opts"><button class="opt" data-v="1">E vërtetë</button><button class="opt" data-v="0">E gabuar</button></div></div><div class="fbh"></div></div>`).join('')}</div></div>`;
  if (c.order) h += `<div class="block"><h3>Renditja</h3><p class="sub">${esc(c.order.prompt)} Përdor shigjetat ↑ ↓.</p><ol class="order" id="ord"></ol><div class="score"><span id="ordmsg"></span><span style="display:flex;gap:8px"><button class="btn" id="ordmix">Përziej</button><button class="btn pri" id="ordchk">Kontrollo</button></span></div></div>`;
  h = `<div class="block"><h3>Detyra praktike</h3><p class="sub">Shkruaj kodin, shiko rezultatin dhe kliko “Kontrollo”. Kontrolli automatik tregon çfarë është në rregull dhe çfarë mungon.</p>${c.exercises.map((e,i)=>`<div class="ex task" data-i="${i}"><h4>Detyra ${i+1}: ${esc(e.t)}</h4><p>${esc(e.task)}</p>${liveHTML(e.start, 'Kodi yt', 'lvtask')}<div class="trybar"><button class="btn pri chk">✓ Kontrollo</button><button class="btn sol">Shfaq zgjidhjen</button><span class="tscore"></span></div><ul class="checks"></ul></div>`).join('')}</div>` + h;
  return h;
}
function bindQuiz(root, list, chId, kind, onScore){
  const s = (scores[chId]||{})[kind] || {};
  root.querySelectorAll('.q').forEach(qd => {
    const i = +qd.dataset.i, q = list[i];
    const answer = j => {
      qd.querySelectorAll('.opt').forEach((b,k) => { b.disabled = true; if (k===q.a) b.classList.add('ok'); });
      const ok = j === q.a;
      if (!ok) qd.querySelectorAll('.opt')[j].classList.add('no');
      qd.querySelector('.fbh').innerHTML = `<div class="fb ${ok?'ok':'no'}">${ok?'Saktë!':'Jo saktë.'} <span>${esc(q.e||'')}</span></div>`;
      return ok;
    };
    qd.querySelectorAll('.opt').forEach(b => b.onclick = () => { const ok = answer(+b.dataset.j); if(chId) setScore(chId, kind, i, ok); onScore(); });
    if (chId && s[i] !== undefined && q.picked === undefined){ /* restore only correctness state */ }
  });
}
function bindPractice(c){
  bindLive(); bindTasks(c);
  if (!c.quiz.length) return;
  const qs = () => { const n = [...document.querySelectorAll('#quiz .fb.ok')].length; document.getElementById('qs').textContent = `${n} / ${c.quiz.length}`; };
  bindQuiz(document.getElementById('quiz'), c.quiz, c.id, 'quiz', qs);
  document.getElementById('qreset').onclick = () => { if(scores[c.id]) { scores[c.id].quiz = {}; store.set('scores',scores); } render(); };
  document.querySelectorAll('#tf .q').forEach(qd => {
    const i = +qd.dataset.i, [txt, val] = c.tf[i];
    qd.querySelectorAll('.opt').forEach(b => b.onclick = () => {
      const pick = b.dataset.v === '1', ok = pick === val;
      qd.querySelectorAll('.opt').forEach(x => { x.disabled = true; if ((x.dataset.v==='1') === val) x.classList.add('ok'); });
      if (!ok) b.classList.add('no');
      qd.querySelector('.fbh').innerHTML = `<div class="fb ${ok?'ok':'no'}">${ok?'Saktë!':'Jo saktë.'} <span>Pohimi është ${val?'i vërtetë':'i gabuar'}.</span></div>`;
      setScore(c.id, 'tf', i, ok);
    });
  });
  if (c.order){
    let cur = c.order.items.map((_,i)=>i);
    const mix = () => { do { cur.sort(()=>Math.random()-.5); } while (cur.every((v,i)=>v===i)); draw(); document.getElementById('ordmsg').textContent=''; };
    const draw = (check) => {
      document.getElementById('ord').innerHTML = cur.map((k,pos)=>`<li class="${check ? (k===pos?'ok':'no') : ''}"><span class="pos">${pos+1}.</span><span class="txt">${esc(c.order.items[k])}</span><button class="mv" data-p="${pos}" data-d="-1" aria-label="Lart">↑</button><button class="mv" data-p="${pos}" data-d="1" aria-label="Poshtë">↓</button></li>`).join('');
      document.querySelectorAll('#ord .mv').forEach(b => b.onclick = () => { const p=+b.dataset.p, d=+b.dataset.d, t=p+d; if(t<0||t>=cur.length) return; [cur[p],cur[t]]=[cur[t],cur[p]]; draw(); document.getElementById('ordmsg').textContent=''; });
    };
    document.getElementById('ordmix').onclick = mix;
    document.getElementById('ordchk').onclick = () => { draw(true); const n = cur.filter((k,p)=>k===p).length; document.getElementById('ordmsg').innerHTML = n===cur.length ? '<b style="color:var(--good)">Renditje e saktë!</b>' : `<b>${n} / ${cur.length}</b> në vendin e duhur`; };
    mix();
  }
}

/* ---------- FINAL TEST ---------- */
function finalTest(){
  const pool = []; DATA.forEach(c => c.quiz.forEach(q => pool.push({...q, from:c.code.replace('·','')})));
  pool.sort(()=>Math.random()-.5);
  const list = pool.slice(0,15);
  const main = document.getElementById('main');
  main.innerHTML = `<div class="chead"><span class="eyebrow">Përsëritje e përgjithshme</span><h2>${FINAL.title}</h2><p class="rm">${FINAL.rm}</p></div>
  <div class="block"><div id="fq">${list.map((q,i)=>quizQ(q,i,'final').replace('<div class="qt">', `<div class="qt"><span class="code" style="height:22px;padding:0 6px;font-size:11px;margin-right:8px">${q.from}</span>`)).join('')}</div>
  <div class="score"><span>Rezultati: <b id="fs">0 / ${list.length}</b> <span id="fgrade" class="count"></span></span><button class="btn pri" id="fnew">Test i ri</button></div></div>`;
  const upd = () => {
    const ok = document.querySelectorAll('#fq .fb.ok').length, done = document.querySelectorAll('#fq .fb').length;
    document.getElementById('fs').textContent = `${ok} / ${list.length}`;
    if (done === list.length){ const p = ok/list.length; const g = p>=.9?5:p>=.75?4:p>=.6?3:p>=.45?2:1; document.getElementById('fgrade').textContent = `· nota orientuese: ${g}`; }
  };
  bindQuiz(document.getElementById('fq'), list, null, 'final', upd);
  document.getElementById('fnew').onclick = () => { finalTest(); window.scrollTo({top:0}); };
}

/* ---------- RENDER ---------- */
function render(){
  renderNav(); renderOverall();
  if (state.ch === 'test') return finalTest();
  const c = DATA.find(x => x.id === state.ch);
  const main = document.getElementById('main');
  main.innerHTML = `<div class="chead"><span class="eyebrow">${'Mësimi ' + (DATA.indexOf(c)+1) + ' nga ' + DATA.length}</span><h2>${esc(c.title)}</h2><p class="rm intro">${esc(c.intro)}</p></div>
  <div class="modes" role="tablist">${MODES.map(([k,l])=>`<button role="tab" data-m="${k}" aria-selected="${k===state.mode}">${l}</button>`).join('')}</div>
  <div id="pane"></div>`;
  main.querySelectorAll('.modes button').forEach(b => b.onclick = () => { state.mode = b.dataset.m; store.set('mode', state.mode); render(); });
  const pane = document.getElementById('pane');
  if (state.mode === 'learn'){ pane.innerHTML = learnHTML(c); bindCalc(); bindTry(); bindApisim(); bindLive(); }
  if (state.mode === 'review'){ pane.innerHTML = reviewHTML(c); bindReview(c); }
  if (state.mode === 'practice'){ pane.innerHTML = practiceHTML(c); bindPractice(c); }
}
render();
</script>
